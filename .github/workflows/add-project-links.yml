name: Add project links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add verified project links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          links = {
              'Book Recommendation System': 'https://github.com/kattubadimohammad/Book-Recommendation-System',
              'Resume Classification': 'https://github.com/kattubadimohammad/Resume-Classification',
              'Two-Wheeler Website Design': 'https://github.com/kattubadimohammad/Two-Wheeler-Web-Design',
          }

          added = 0
          for title, url in links.items():
              pattern = rf'(<article class="project-grid-card">.*?<h3[^>]*>\s*{re.escape(title)}\s*</h3>.*?<div class="project-tags">.*?</div>)(</article>)'
              m = re.search(pattern, s, flags=re.S)
              if not m:
                  raise SystemExit(f'Project card not found: {title}')
              block = m.group(0)
              if 'project-links' in block:
                  continue
              actions = (
                  '<div class="project-links mt-3">'
                  f'<a class="btn btn-outline-primary btn-sm mr-2 mb-2" href="{url}" target="_blank" rel="noopener noreferrer">GitHub Repository</a>'
                  '</div>'
              )
              replacement = m.group(1) + actions + m.group(2)
              s = s[:m.start()] + replacement + s[m.end():]
              added += 1

          p.write_text(s, encoding='utf-8')
          print(f'Project link cards updated: {added}')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add GitHub links to project cards'
          git push
